name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Downloads the sherpa-onnx AAR via the fetchSherpaOnnx task.
      - run: ./gradlew :bindings:android:testDebugUnitTest

      - run: ./gradlew :examples:android-demo:assembleDebug
